description: Rebookify is a travel-technology company that helps travel agencies and travel
  management companies save money on hotel bookings by continuously monitoring the price of existing
  hotel reservations and automatically rebooking them at lower rates whenever prices drop, capturing
  the savings without changing the guest's stay. Backed by 500 Global, Rebookify operates a
  business-facing web product at rebookify.com. As of this enrichment pass no public developer API,
  documentation, developer portal, SDKs, or /.well-known discovery surface has been identified.
